<script>'use strict';
const RSW_THEME_KEY='rsw_premium_theme_v1';
function rswSetTheme(value){
 const mode=value==='light'?'light':'dark';
 document.documentElement.dataset.theme=mode;
 try{localStorage.setItem(RSW_THEME_KEY,mode)}catch(e){}
 document.querySelectorAll('[data-theme-toggle]').forEach(btn=>{
  btn.setAttribute('aria-label',mode==='dark'?'Hellen Modus aktivieren':'Dunklen Modus aktivieren');
  btn.setAttribute('aria-pressed',mode==='dark'?'true':'false');
  const glyph=btn.querySelector('.theme-toggle-glyph'),label=btn.querySelector('.theme-toggle-label');
  if(glyph)glyph.textContent=mode==='dark'?'☀':'☾';
  if(label)label.textContent=mode==='dark'?'Hell':'Dunkel';
 });
}
document.addEventListener('click',e=>{
 const toggle=e.target.closest('[data-theme-toggle]');if(!toggle)return;
 e.preventDefault();e.stopPropagation();
 rswSetTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
},true);
rswSetTheme(document.documentElement.dataset.theme);
const TYPES = {
  article:{label:'Artikel',plural:'Artikel',icon:'▤',hint:'Freier Wissenseintrag'},
  person:{label:'Biografie',plural:'Personen',icon:'♙',hint:'Menschen & Lebensgeschichten'},
  place:{label:'Ort',plural:'Orte',icon:'⌖',hint:'Städte, Länder & Schauplätze'},
  server:{label:'Server',plural:'Server',icon:'▣',hint:'Rec Room Server, Besitzer & Räume'},
  event:{label:'Ereignis',plural:'Ereignisse',icon:'◷',hint:'Geschehnisse & Wendepunkte'},
  object:{label:'Objekt',plural:'Objekte',icon:'◇',hint:'Dokumente & Exponate'}
};
const TYPE_FIELDS={
 person:[['born','Geboren'],['died','Gestorben'],['birthplace','Geburtsort'],['occupation','Tätigkeit'],['significance','Bedeutung']],
 place:[['country','Land / Staat'],['region','Region'],['location','Lage / Adresse'],['coordinates','Koordinaten']],
 server:[],
 event:[['date','Datum / Zeitraum'],['location','Ort / Schauplatz'],['participants','Beteiligte'],['outcome','Ergebnis / Folgen']],
 object:[['dating','Datierung'],['origin','Herkunft'],['creator','Urheber'],['material','Material / Typ']],
 article:[]
};
const BIO_PRESET_FIELDS={birthplace:'Geburtsort',occupation:'Tätigkeit',significance:'Bedeutung'};
function emptyBiographyPresets(){return {birthplace:[],occupation:[],significance:[]}}
function normalizeBiographyPresets(source){
 const saved=source&&typeof source==='object'?source:{};
 const result=emptyBiographyPresets();
 for(const key of Object.keys(BIO_PRESET_FIELDS)){
  const input=Array.isArray(saved[key])?saved[key]:[];
  const seen=new Set();
  for(const raw of input){
   if(typeof raw!=='string')continue;
   const value=raw.trim().slice(0,180);
   if(!value||seen.has(value.toLocaleLowerCase('de')))continue;
   seen.add(value.toLocaleLowerCase('de'));result[key].push(value);
   if(result[key].length>=250)break;
  }
  result[key].sort((a,b)=>a.localeCompare(b,'de'));
 }
 return result;
}
const BLOCKS={heading:'Überschrift',text:'Fließtext',list:'Aufzählung',accordion:'Dropdown-Box',faq:'Fragen & Antworten',timeline:'Zeitleiste',gallery:'Bildergalerie',table:'Tabelle',sources:'Quellen & Links',quote:'Zitat',callout:'Infobox',divider:'Trennlinie'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>('e'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
// Internal cross-references use [[entry-id|visible text]]. Only existing IDs become links.
const plainFormatted=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
function formatted(value){
 const src=String(value||''),re=/\[\[([^\]\|\r\n]{1,150})\|([^\]\r\n]{1,300})\]\]/g;
 let out='',last=0,m;
 while((m=re.exec(src))){
  out+=plainFormatted(src.slice(last,m.index));
  const entry=getEntry(m[1]);
  out+=entry?`<button type="button" class="wiki-link" data-wikilink="${esc(entry.id)}" title="${esc(typeName(entry))}: ${esc(entry.title)}">${esc(m[2])}</button>`:`<span class="wiki-link-missing" title="Verknüpfter Eintrag nicht vorhanden">${esc(m[2])}</span>`;
  last=re.lastIndex;
 }
 return out+plainFormatted(src.slice(last));
}
const safeLink=s=>typeof s==='string'&&/^https?:\/\/[^\s]+$/i.test(s.trim())?s.trim():'';
const safeColor=s=>/^#[0-9a-f]{6}$/i.test(s||'')?s:'#46536c';
const paragraphs=s=>String(s||'').split(/\n\s*\n/).filter(x=>x.trim()).map(p=>`<p>${formatted(p).replace(/\n/g,'<br>')}</p>`).join('');
const dateShort=s=>{try{return new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s))}catch{return '—'}};
const makeBlock=type=>{
 switch(type){case'heading':return{type,title:''};case'text':return{type,text:''};case'list':return{type,items:['']};case'accordion':return{type,title:'',text:''};case'faq':return{type,items:[{question:'',answer:''}]};case'timeline':return{type,items:[{date:'',text:''}]};case'gallery':return{type,images:[]};case'table':return{type,items:[{key:'',value:''}]};case'sources':return{type,items:[{title:'',url:''}]};case'quote':return{type,text:'',source:''};case'callout':return{type,title:'',text:''};default:return{type:'divider'}}
};
const dbName='recserverwiki_shared_v1';let memoryFallback=false,dbPromise;
function openDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((res,rej)=>{if(!window.indexedDB){rej(Error('IndexedDB nicht verfügbar'));return}const req=indexedDB.open(dbName,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('storage'))req.result.createObjectStore('storage')};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});return dbPromise}
async function readState(){try{let db=await openDb();return await new Promise((res,rej)=>{let tx=db.transaction('storage','readonly'),r=tx.objectStore('storage').get('collection');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){memoryFallback=true;try{return JSON.parse(localStorage.getItem(dbName))}catch{return null}}}
async function saveState(){try{if(memoryFallback){localStorage.setItem(dbName,JSON.stringify(state));return}const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('storage','readwrite');tx.objectStore('storage').put(state,'collection');tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}catch(e){console.warn('storage',e);toast('Speichern fehlgeschlagen. Exportiere zur Sicherheit dein Archiv.');throw e}}
let state={exhibits:[],categories:[],biographyPresets:emptyBiographyPresets()};
let app={view:'home',detailId:null,articleTrail:[],filter:'Alle',typeFilter:'all',categoryScope:'all',query:'',sort:'newest',layout:'grid',editing:null,isNew:false,dirty:false,linkTarget:null};
const sortNewest=arr=>arr.slice().sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0));
const getEntry=key=>state.exhibits.find(x=>x.id===key);
const getCategory=key=>state.categories.find(x=>x.id===key);
const entryCats=e=>(e.categories||[]).map(getCategory).filter(Boolean);
const SERVER_FIELDS=[["serverCurrency","Währung"],["serverClubName","Club"]];
const SERVER_STATS=[["serverVisits","Visits"],["serverRegularVisitors","Regelmäßige Besucher"],["serverClubMembers","Clubmitglieder"],["serverClubRegularMembers","Regelmäßige Clubmitglieder"]];
function isServerLocation(e){return !!e&&e.type==='server'}
function serverPhotos(e){
 return (Array.isArray(e?.serverPhotos)?e.serverPhotos:[]).slice(0,8)
  .filter(x=>x&&typeof x==='object'&&safeImage(x.src))
  .map(x=>({src:safeImage(x.src),caption:String(x.caption||'').slice(0,180)}));
}
function serverTextList(value){
 return String(value||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).slice(0,40);
}
function serverBiographyChoices(){
 return state.exhibits.filter(x=>x.type==='person').slice().sort((a,b)=>a.title.localeCompare(b.title,'de'));
}
function serverSelectedPerson(rawId,legacyName=''){
 const selected=getEntry(String(rawId||'').trim());
 if(selected?.type==='person')return selected;
 const name=String(legacyName||'').trim().toLocaleLowerCase('de');
 return name?serverBiographyChoices().find(x=>x.title.trim().toLocaleLowerCase('de')===name)||null:null;
}
function serverModeratorIds(e){
 const raw=String(e?.details?.serverModeratorIds||'');
 return [...new Set(raw.split(',').map(id=>id.trim()).filter(Boolean))].slice(0,100);
}
function serverRoleButton(person,legacy){
 if(person)return `<button type="button" class="server-person-link" data-open="${esc(person.id)}" title="Biografie von ${esc(person.title)} öffnen">${esc(person.title)} <span aria-hidden="true">↗</span></button>`;
 return legacy?`<span class="server-person-legacy">${esc(legacy)}</span>`:'';
}
function serverTeam(e){
 const details=e.details||{},owner=serverSelectedPerson(details.serverOwnerId,details.serverOwner);
 const coOwner=serverSelectedPerson(details.serverCoOwnerId,details.serverCoOwner);
 const moderators=serverModeratorIds(e).map(getEntry).filter(x=>x&&x.type==='person');
 const oldMods=serverTextList(details.serverModerators);
 const hasTeam=owner||coOwner||moderators.length||details.serverOwner||details.serverCoOwner||oldMods.length;
 if(!hasTeam)return '';
 const role=(label,person,legacy)=>person||legacy?`<div class="server-team-role"><div class="server-team-label">${label}</div><div class="server-team-value">${serverRoleButton(person,legacy)}</div></div>`:'';
 return `<section class="server-team"><h3>Team & Verwaltung</h3><div class="server-team-grid">
  ${role('Owner',owner,owner?'':details.serverOwner)}
  ${role('Co-Owner',coOwner,coOwner?'':details.serverCoOwner)}
  ${(moderators.length||oldMods.length)?`<div class="server-team-role server-team-moderators"><div class="server-team-label">Moderatoren</div><div class="server-team-value">${moderators.map(person=>serverRoleButton(person,'')).join('')}${oldMods.filter(name=>!moderators.some(p=>p.title.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))).map(name=>serverRoleButton(null,name)).join('')}</div></div>`:''}
 </div></section>`;
}
function serverProfile(e){
 if(!isServerLocation(e))return '';
 const d=e.details||{},description=String(d.serverDescription||'').trim();
 const allies=serverTextList(d.serverAllies),inventions=serverTextList(d.serverInventions),companies=serverTextList(d.serverCompanies);
 const stats=SERVER_STATS.filter(([key])=>String(d[key]??'').trim());
 const photos=serverPhotos(e),team=serverTeam(e);
 if(!description&&!allies.length&&!photos.length&&!team&&!stats.length&&!inventions.length&&!companies.length)return '';
 const chips=(title,items)=>items.length?`<div class="server-profile-allies"><h3>${title}</h3><div class="server-ally-list">${items.map(v=>`<span class="server-ally">${esc(v)}</span>`).join('')}</div></div>`:'';
 return `<section class="server-profile">

 const hasStale=storedId&&!people.some(p=>p.id===storedId);
 const options=people.map(p=>`<option value="${esc(p.id)}" ${p.id===(storedId||match?.id)?'selected':''}>${esc(p.title)}</option>`).join('');
 return `<label class="field server-person-select"><span>${esc(label)} · Biografie</span><select data-detail-field="${esc(key)}">

  ${options}
 </select>${!match&&details[legacyKey]?`<small>Bisheriger Eintrag: ${esc(details[legacyKey])}. Zum Verlinken eine Biografie auswählen.</small>`:''}</label>`;
}

function categoryScope(c){return c&&TYPES[c.scope]?c.scope:'all'}
function categoryMatchesEntry(c,type){
 const scope=categoryScope(c);
 if(type==='all')return true;
 if(scope==='all'||scope===type)return true;
 return type==='server'&&scope==='place'&&/\bservers?\b/i.test(String(c.name||'').trim());
}
function categoryScopeLabel(scope){return ({all:'Allgemein',article:'Artikel',person:'Biografien',place:'Orte',server:'Server',event:'Ereignisse',object:'Objekte'})[scope]||'Allgemein'}

const yearNum=e=>{let m=String(e.year||e.details?.date||'').match(/-?\d{3,4}/);return m?parseInt(m[0],10):99999};
const filtered=items=>items.filter(e=>{const q=app.query.trim().toLocaleLowerCase('de');const corpus=[e.title,e.subtitle,e.year,e.type,(e.tags||[]).join(' '),JSON.stringify(e.details||{}),JSON.stringify(e.facts||[]),JSON.stringify(e.blocks||[]),...entryCats(e).map(c=>c.name)].join(' ').toLocaleLowerCase('de');return (!q||corpus.includes(q))&&(app.filter==='Alle'||(e.categories||[]).includes(app.filter))&&(app.typeFilter==='all'||e.type===app.typeFilter)});
const sorted=items=>items.slice().sort((a,b)=>app.sort==='az'?a.title.localeCompare(b.title,'de'):app.sort==='oldest'?new Date(a.updatedAt||0)-new Date(b.updatedAt||0):app.sort==='year'?yearNum(a)-yearNum(b):new Date(b.updatedAt||0)-new Date(a.updatedAt||0));
function safeImage(src){return typeof src==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,[a-zA-Z0-9+/=\s]+$/.test(src)?src:''}
const iconStar=on=>`<svg width="17" height="17" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6"><path d="m12 2 3.3 6.7 7.4 1.1-5.3 5.1 1.3 7.3L12 18.8l-6.7 3.4 1.3-7.3L1.3 9.8l7.4-1.1z"/></svg>`;
const typeName=e=>TYPES[e.type]?.label||'Artikel';
const typeIcon=type=>TYPES[type]?.icon||'▤';
function cover(e,article=false){const image=safeImage(e.cover);return `<div class="${article?'article-cover':'card-cover'}" style="background:${safeColor(e.theme)}">${image?`<img src="${image}" alt="Titelbild: ${esc(e.title)}">`:`<div class="cover-decoration"></div><div class="cover-type-visual">${typeIcon(e.type)}</div>`}<div class="cover-corner">${esc(typeName(e))}</div><div class="cover-label">RecServerNews / ARCHIV</div></div>`}
function catTags(e,linked=false){return entryCats(e).map(c=>linked?`<button class="category-pill" style="--cat:${safeColor(c.color)}" data-cat-filter="${esc(c.id)}">${esc(c.name)}</button>`:`<span class="category-pill" style="--cat:${safeColor(c.color)}">${esc(c.name)}</span>`).join('')}
function card(e){return `<article class="museum-card" data-open="${esc(e.id)}" role="button" tabindex="0" aria-label="${esc(e.title)} öffnen">${cover(e)}<div class="card-content"><div class="card-top"><span class="kind-label"><span>${typeIcon(e.type)}</span>${esc(typeName(e))}</span><span class="card-date">${esc(e.year||'Ohne Datum')}</span></div><h3 class="card-title">${esc(e.title)}</h3><p class="card-desc">${esc(e.subtitle||(isServerLocation(e)?e.details?.serverDescription||'':''))}</p>${entryCats(e).length?`<div class="card-cats">${catTags(e)}</div>`:''}<div class="card-footer"><span>Eintrag ansehen ↗</span><button class="heart ${e.starred?'is-on':''}" data-fav="${esc(e.id)}" aria-label="Favorit umschalten">${iconStar(e.starred)}</button></div></div></article>`}
function empty(title,text,button=true){return `<div class="empty-state"><div class="empty-orbit"><span>✧</span></div><h3>${esc(title)}</h3><p>${esc(text)}</p>${button&&cloudCanEdit()?'<button class="btn btn-accent" data-act="new">+ Neuen Eintrag erstellen</button>':''}</div>`}
function quickTypes(){return `<div class="quick-grid">${Object.entries(TYPES).map(([k,t])=>`<button class="quick-type" data-new-type="${k}"><span class="quick-icon">${t.icon}</span><span><strong>${t.label}</strong><small>${t.hint}</small></span><span class="quick-arrow">↗</span></button>`).join('')}</div>`}
function home(){const featured=sortNewest(state.exhibits).sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)).slice(0,6);return `<section class="hero"><div class="hero-content"><div class="eyebrow">RecServerNews / DEIN WISSENSARCHIV</div><h1>Ein Ort für<br><em>jede Geschichte.</em></h1><p>Baue dein eigenes Museum. Dokumentiere Menschen, Orte, Ereignisse und Ideen mit Bildern, Quellen und interaktiven Artikeln.</p>${cloudCanEdit()?'<button class="btn" data-act="new">+ Neuen Eintrag erstellen <span>↗</span></button>':'<button class="btn" data-nav="library">Öffentliche Artikel lesen <span>↗</span></button>'}</div><div class="hero-art"></div><div class="hero-stamp">OPEN KNOWLEDGE / PUBLIC ARCHIVE</div></section><section class="metrics"><div class="metric"><strong>${state.exhibits.length}</strong><span>Einträge</span></div><div class="metric"><strong>${state.categories.length}</strong><span>Kategorien</span></div><div class="metric"><strong>${state.exhibits.reduce((n,e)=>n+(e.blocks||[]).length,0)}</strong><span>Inhaltsbausteine</span></div></section><div class="section-head"><div><div class="eyebrow">DEIN MUSEUM GESTALTEN</div><h2 class="section-title">Was möchtest du dokumentieren?</h2></div></div>${cloudCanEdit()?quickTypes():''}${state.exhibits.length?`<div class="section-head"><div><div class="eyebrow">DEIN ARCHIV</div><h2 class="section-title">Zuletzt bearbeitet</h2></div><button class="link-btn" data-nav="library">Alle Einträge →</button></div><div class="cards">${featured.map(card).join('')}</div>`:`<div class="welcome-note"><span class="welcome-dot"></span>Noch keine Artikel veröffentlicht. Das öffentliche Wiki startet ohne Beispielinhalte.</div>`}`}
function library(favs=false){const source=favs?state.exhibits.filter(e=>e.starred):state.exhibits;const items=sorted(filtered(source));return `<div class="eyebrow">ARCHIV / ${favs?'MERKLISTE':'SAMMLUNG'}</div><div class="page-title-row"><div><h1 class="h1">${favs?'Merkliste':'Die Sammlung'}</h1><p class="subtitle">${favs?'Gespeicherte Einträge an einem Ort.':cloudCanEdit()?'Entdecke und verwalte die gemeinsamen Wiki-Artikel.':'Alle veröffentlichten Artikel sind für jeden frei lesbar.'}</p></div>${cloudCanEdit()?'<button class="btn btn-accent" data-act="new">+ Eintrag</button>':''}</div><div class="catalog-toolbar"><div class="toolbar-label">Eintragstyp</div><div class="filters type-filters"><button class="filter ${app.typeFilter==='all'?'active':''}" data-type-filter="all">Alle</button>${Object.entries(TYPES).map(([k,t])=>`<button class="filter ${app.typeFilter===k?'active':''}" data-type-filter="${k}">${t.icon} ${t.label}</button>`).join('')}</div><div class="toolbar-label">Kategorien <button class="toolbar-link" data-nav="categories">Verwalten ↗</button></div><div class="filters category-filters"><button class="filter ${app.filter==='Alle'?'active':''}" data-filter="Alle">Alle Kategorien</button>${state.categories.filter(c=>categoryMatchesEntry(c,app.typeFilter)).map(c=>`<button class="filter ${app.filter===c.id?'active':''}" data-filter="${esc(c.id)}"><span class="category-dot" style="background:${safeColor(c.color)}"></span>${esc(c.name)}</button>`).join('')}${!state.categories.length?'<span class="muted-compact">Noch keine Kategorien erstellt</span>':''}</div><div class="catalog-bottom"><span>${items.length} ${items.length===1?'Eintrag':'Einträge'}</span><div class="catalog-controls"><label class="sort-control">Sortierung <select id="sortSelect"><option value="newest" ${app.sort==='newest'?'selected':''}>Zuletzt geändert</option><option value="oldest" ${app.sort==='oldest'?'selected':''}>Älteste zuerst</option><option value="az" ${app.sort==='az'?'selected':''}>Name A–Z</option><option value="year" ${app.sort==='year'?'selected':''}>Chronologisch</option></select></label><button class="layout-toggle ${app.layout==='grid'?'chosen':''}" data-layout="grid" aria-label="Kartenansicht">▦</button><button class="layout-toggle ${app.layout==='list'?'chosen':''}" data-layout="list" aria-label="Listenansicht">☷</button></div></div></div>${items.length?`<div class="cards ${app.layout==='list'?'cards-list':''}">${items.map(card).join('')}</div>`:empty(source.length?'Keine passenden Ergebnisse':favs?'Noch keine Favoriten':'Noch keine Artikel veröffentlicht',source.length?'Entferne einen Filter oder ändere die Suche.':'Nach Veröffentlichung erscheinen hier die gemeinsamen Wiki-Artikel.',!source.length)}</div>`}
function timeline(){const entries=filtered(state.exhibits).filter(e=>yearNum(e)!==99999).sort((a,b)=>yearNum(a)-yearNum(b));return `<div class="eyebrow">ARCHIV / CHRONOLOGIE</div><h1 class="h1">Zeitstrahl</h1><p class="subtitle">Alle Einträge mit Jahresangaben, automatisch chronologisch geordnet.</p>${entries.length?`<div class="timeline">${entries.map(e=>`<div class="time-row"><div class="time-year">${esc(e.year)}</div><div class="time-item" data-open="${esc(e.id)}" role="button" tabindex="0"><small>${esc(typeName(e))} ${entryCats(e).length?' · '+esc(entryCats(e)[0].name):''}</small><h3>${esc(e.title)}</h3><p>${esc(e.subtitle||'Eintrag öffnen →')}</p></div></div>`).join('')}</div>`:empty('Noch keine Daten im Zeitstrahl','Einträge mit Jahreszahlen oder Zeiträumen erscheinen automatisch hier.')}`}
function categoriesPage(){
 const scopes=['all','person','place','server','event','object','article'],chosen=app.categoryScope||'all';
 const current=state.categories.filter(c=>categoryScope(c)===chosen);
 const tabs=scopes.map(scope=>{
  const count=state.categories.filter(c=>categoryScope(c)===scope).length,icon=scope==='all'?'✧':TYPES[scope].icon;
  return `<button class="scope-tab ${chosen===scope?'active':''}" type="button" data-category-scope="${scope}" aria-pressed="${chosen===scope}"><span class="scope-tab-icon">${icon}</span><span>${categoryScopeLabel(scope)}</span><small>${count}</small></button>`;
 }).join('');
 return `<div class="eyebrow">RECSERVERWIKI / TAXONOMIE</div>
 <div class="page-title-row scope-head"><div><h1 class="h1">Kategorien<span class="heading-accent">.</span></h1>

 <section class="category-create"><div><span class="eyebrow">NEU ERSTELLEN</span><h2>Kategorie für ${categoryScopeLabel(chosen)}</h2><p>Erstelle deine eigenen Unterteilungen. Keine vorgegebenen Listen.</p></div>
 <form id="categoryForm" class="category-form"><input id="categoryName" maxlength="60" placeholder="Name der Kategorie" aria-label="Kategoriename" required><label class="color-selector" title="Kategoriefarbe"><input id="categoryColor" type="color" value="#9278f7" aria-label="Farbe"></label><button class="btn btn-accent" type="submit">+ Kategorie</button></form></section>
 <div class="section-head"><div><div class="eyebrow">${current.length} KATEGORIEN</div><h2 class="section-title">${categoryScopeLabel(chosen)} verwalten</h2></div></div>
 ${current.length?`<div class="category-management-grid">${current.map(c=>`<div class="manage-category"><div class="cat-head"><span class="cat-large-dot" style="background:${safeColor(c.color)}"></span><strong>${esc(c.name)}</strong><span class="category-count">${state.exhibits.filter(e=>(e.categories||[]).includes(c.id)).length} Einträge</span></div><div class="manage-category-actions"><input data-category-name="${esc(c.id)}" value="${esc(c.name)}" maxlength="60" aria-label="Kategorie umbenennen"><input type="color" data-category-color="${esc(c.id)}" value="${safeColor(c.color)}" aria-label="Kategoriefarbe"><button class="btn btn-ghost btn-sm" data-act="save-category" data-id="${esc(c.id)}">Speichern</button><button class="btn btn-danger btn-sm" data-act="remove-category" data-id="${esc(c.id)}">Löschen</button></div></div>`).join('')}</div>`:empty('Hier ist noch Platz','Für diesen Bereich wurden noch keine Kategorien erstellt.',false)}</div>`;

function about(){return `<div class="eyebrow">ARCHIV / VERWALTUNG</div><h1 class="h1">Archiv & Daten</h1><p class="subtitle">Das öffentliche Wiki synchronisiert Artikel für alle Besucher. Einträge bearbeiten dürfen freigeschaltete Redakteure.</p><div class="about-grid"><div class="about-card"><div class="about-icon">↥</div><h3>Exportieren</h3><p>Sichere alle Beiträge, Kategorien, Verknüpfungen und Bilder zusammen in einer JSON-Datei.</p><button class="btn btn-accent" data-act="export">↓ Archiv sichern</button></div><div class="about-card"><div class="about-icon">↧</div><h3>Importieren</h3><p>Stelle eine Sicherung wieder her. Der Import ersetzt die aktuelle Sammlung vollständig.</p><button class="btn btn-ghost" data-act="import-trigger">↑ JSON importieren</button></div><div class="about-card"><div class="about-icon">♧</div><h3>Volle Freiheit</h3><p>Lege Personen, Orte, Ereignisse, Artikel und Objekte an. Passe Kategorien, Fakten, Texte und Farben an.</p><button class="btn btn-ghost" data-nav="categories">Kategorien verwalten</button></div><div class="about-card"><div class="about-icon">◴</div><h3>Lokal gespeichert</h3><p>Die öffentliche Sammlung wird mit Supabase synchronisiert. Eine lokale Kopie erleichtert den Offline-Zugriff.</p></div></div><div class="warning"><strong>Speicherhinweis:</strong> Wenn du Browserdaten löschst oder eine andere Browser-App verwendest, können Einträge fehlen. Import und Export sind deshalb wichtig.</div><div class="danger-zone"><div><strong>Sammlung leeren</strong><p>Entfernt alle selbst angelegten Einträge und Kategorien. Es werden keine Beispiele eingesetzt.</p></div><button class="btn btn-danger" data-act="reset">Alles löschen</button></div>`}

function renderBlock(b,index){switch(b.type){
case'heading':return `<section class="article-block"><h2 id="section-${index}">${esc(b.title||'Abschnitt')}</h2></section>`;
case'text':return `<section class="article-block prose">${paragraphs(b.text)||'<p></p>'}</section>`;
case'list':return `<section class="article-block"><ul class="article-bullets">${(b.items||[]).map(it=>`<li>${formatted(it)}</li>`).join('')}</ul></section>`;
case'accordion':return `<section class="article-block"><details class="details"><summary>${esc(b.title||'Mehr erfahren')}</summary><div class="details-content">${paragraphs(b.text)}</div></details></section>`;
case'faq':return `<section class="article-block"><div class="eyebrow" style="margin-bottom:12px">Fragen & Antworten</div>${(b.items||[]).map(x=>`<details class="details"><summary>${esc(x.question||'Frage')}</summary><div class="details-content">${paragraphs(x.answer)}</div></details>`).join('')}</section>`;
case'timeline':return `<section class="article-block"><div class="inside-timeline">${(b.items||[]).map(x=>`<div class="inside-event"><strong>${esc(x.date||'Datum')}</strong><p>${formatted(x.text||'')}</p></div>`).join('')}</div></section>`;
case'gallery':return `<section class="article-block"><div class="gallery">${(b.images||[]).filter(x=>safeImage(x.src)).map(x=>`<figure><img loading="lazy" alt="${esc(x.caption||'Archivbild')}" src="${safeImage(x.src)}"/><figcaption>${esc(x.caption||'')}</figcaption></figure>`).join('')}</div></section>`;
case'table':return `<section class="article-block"><table class="info-table"><tbody>${(b.items||[]).map(x=>`<tr><td>${esc(x.key)}</td><td>${formatted(x.value)}</td></tr>`).join('')}</tbody></table></section>`;

function findLinkToken(src,start,end){

}

function insertInternalLink(targetId){
 const target=getEntry(targetId),t=app.linkTarget;if(!target||!t)return;

 // Protect the small, readable wiki-token format from malformed label delimiters.

 const token=`[[${target.id}|${cleanLabel}]]`;
 t.area.value=t.area.value.slice(0,t.start)+token+t.area.value.slice(t.end);

  const draft=await readState();
  if(draft&&Array.isArray(draft.exhibits)&&Array.isArray(draft.categories)){
   state=migrateData(draft);
   render();
  }
 }catch(e){console.warn('Lokaler Redaktionsentwurf konnte nicht gelesen werden',e)}
}
async function cloudSignIn(signup=false){
 const email=document.getElementById('cloudEmail')?.value.trim(),password=document.getElementById('cloudPassword')?.value||'';
 if(!email||!password){toast('E-Mail und Passwort eingeben.');return}
 cloudStatus('Anmeldung läuft …','busy');
 try{const redirect='signup?redirect_to='+encodeURIComponent(CLOUD_SITE_URL);
  const s=await cloudAuthRequest(signup?redirect:'token?grant_type=password',{email,password});
  if(!s.access_token){cloudStatus('Registrierung angenommen. Falls die Bestätigung aktiv ist, prüfe Posteingang und Spam. Ohne E-Mail: Supabase → Authentication → Users prüfen.','auth');toast('Registrierung geprüft. Möglicherweise E-Mail-Bestätigung nötig.');return}
  cloudRememberSession(s);cloud.revision=null;cloud.blocked=false;cloud.dirty=false;
  await cloudCheckRole();await cloudRestoreEditorDraft();await cloudReconcile();
 }catch(e){cloudOnError(e)}finally{cloudRenderModal()}
}
async function cloudSignOut(){
 if(cloud.session){try{await cloudFetch('/auth/v1/logout',{method:'POST',auth:true})}catch(e){console.warn('Logout',e)}}
 cloud.session=null;cloud.role='reader';cloudPut(CLOUD_AUTH_KEY,null);cloud.revision=null;cloud.blocked=false;cloud.dirty=false;
 if(app.editing){app.editing=null;app.dirty=false;$('#drawerHost').innerHTML='';document.body.style.overflow=''}
 state={exhibits:[],categories:[],biographyPresets:emptyBiographyPresets()};render();cloudStatus('Abgemeldet. Öffentliches Wiki wird geladen …','busy');await cloudReconcile();cloudRenderModal();
}
async function cloudSaveConfig(){
 try{const config=cloudValidateConfig(document.getElementById('cloudUrl')?.value,document.getElementById('cloudKey')?.value);
  if(cloud.config&&(cloud.config.url!==config.url||cloud.config.key!==config.key)){
   if(!confirm('Cloud-Projekt ändern? Deine bisherige lokale Sammlung bleibt als Sicherung erhalten.'))return;
   cloud.session=null;cloud.role='reader';cloudPut(CLOUD_AUTH_KEY,null);
  }
  cloud.config=config;cloudPut(CLOUD_CFG_KEY,config);cloud.revision=null;cloud.blocked=false;cloud.dirty=false;
  await cloudReconcile();cloudRenderModal();
 }catch(e){toast(e.message)}
}
function cloudSetBusyGuard(){if(cloud.busy){toast('Cloud-Vorgang läuft bereits.');return true}return false}
function cloudRenderModal(){
 const host=document.getElementById('cloudHost');if(!host||!document.getElementById('cloudModal'))return;
 // Preserve entered values, focus, and scroll during a status refresh. Never store passwords on disk.
 const oldWindow=host.querySelector('.cloud-window'),oldScroll=oldWindow?.scrollTop||0;
 const active=document.activeElement,activeId=host.contains(active)?active?.id:null;
 const selection=(activeId&&typeof active?.selectionStart==='number')?[active.selectionStart,active.selectionEnd]:null;
 const oldFields=Object.fromEntries(['cloudEmail','cloudPassword','cloudUrl','cloudKey'].map(id=>[id,host.querySelector('#'+id)?.value??null]));
 const account=cloud.session,configured=!!cloud.config,editor=cloudCanEdit(),locked=cloud.blocked;
 const content=`<div class="cloud-overlay" id="cloudModal"><div class="cloud-window" role="dialog" aria-modal="true" aria-label="Öffentliches Wiki und Redaktion"><div class="cloud-titlebar"><div><div class="cloud-eyebrow">RECSERVERWIKI / GEMEINSAMES ARCHIV</div><h2>Eine Wikipedia. Für alle.</h2><p>Alle Besucher sehen dieselben Artikel. Nur freigeschaltete Redakteure können Inhalte ändern.</p></div><button type="button" class="cloud-close" data-cloud-action="close" title="Schließen">×</button></div>
 <div class="cloud-pane"><div class="cloud-state"><span class="cloud-state-orb ${esc(cloud.status)}"></span><div><b id="cloudStatusText">${esc(cloud.lastMessage)}</b><small>${account?'Angemeldet: '+esc(account.user.email||'Konto')+' · Rolle: '+esc(cloud.role):'Gast · öffentliches Wiki nur lesen'}</small></div></div>
 ${!configured?`<div class="cloud-stage"><h3>Supabase mit dieser Website verbinden</h3><p>Projekt-URL und ÖFFENTLICHEN Publishable Key eintragen. Damit jeder Besucher das Wiki sofort sieht, einmalig dieselben Angaben in der GitHub-Datei <code>cloud-config.js</code> speichern.</p><label>Supabase-Projekt-URL<input id="cloudUrl" type="url" placeholder="https://projekt.supabase.co"></label><label>Öffentlicher Publishable/Anon Key<input id="cloudKey" type="text" placeholder="sb_publishable_..." spellcheck="false"></label><button type="button" class="cloud-primary" data-cloud-action="save-config">Projekt lokal verbinden</button><p class="cloud-hint">Nur Publishable/Anon! Niemals Secret oder Service-Role-Key.</p></div>`:''}
 ${configured?`<div class="cloud-stage"><h3>${editor?'Redaktion freigeschaltet':'Öffentliches Wiki'}</h3><p>${editor?'Du darfst Artikel veröffentlichen und bearbeiten. Änderungen erscheinen für alle Besucher.':account?'Dein Konto kann Artikel lesen. Der Betreiber muss es erst als Redakteur freischalten.':'Lesen geht ohne Konto. Für die Redaktion kannst du dich hier anmelden.'}</p><div class="cloud-stats"><span><small>Version</small><b>${cloud.revision??'—'}</b></span><span><small>Artikel</small><b>${state.exhibits.length}</b></span><span><small>Kategorien</small><b>${state.categories.length}</b></span></div>
 ${editor&&locked?`<p><strong>Versionskonflikt:</strong> Vor einer Entscheidung bitte eine JSON-Sicherung erstellen.</p><div class="cloud-actions cloud-conflict-actions"><button type="button" class="cloud-primary" data-cloud-action="choose-remote">Öffentliche Version übernehmen</button><button type="button" class="cloud-secondary" data-cloud-action="choose-local">Diese lokale Version veröffentlichen</button></div>`:''}
 <div class="cloud-actions"><button type="button" class="cloud-secondary" data-cloud-action="test-connection">Verbindung testen</button><button type="button" class="cloud-secondary" data-cloud-action="check-now">Öffentliches Archiv aktualisieren</button>${editor&&!locked?'<button type="button" class="cloud-primary" data-cloud-action="sync-now">Jetzt veröffentlichen</button>':''}${account&&!editor?'<button type="button" class="cloud-secondary" data-cloud-action="check-role">Redaktionsrechte erneut prüfen</button>':''}</div>
 <div class="cloud-bottom-actions"><button type="button" class="cloud-text-btn" data-cloud-action="export">↓ JSON-Sicherung herunterladen</button>${editor?'<button type="button" class="cloud-text-btn" data-cloud-action="import-legacy">↥ Alte lokale Artikel übernehmen</button>':''}${account?'<button type="button" class="cloud-text-btn" data-cloud-action="logout">Abmelden</button>':''}</div></div>`:''}
 ${configured&&!account?`<div class="cloud-stage"><h3>Redaktionskonto</h3><p>Alle dürfen lesen. Nur zugelassene Konten dürfen schreiben.</p><label>E-Mail<input id="cloudEmail" type="email" autocomplete="username"></label><label>Passwort<input id="cloudPassword" type="password" minlength="6" autocomplete="current-password"></label><div class="cloud-actions"><button type="button" class="cloud-primary" data-cloud-action="login">Anmelden</button><button type="button" class="cloud-secondary" data-cloud-action="signup">Konto erstellen</button></div><button type="button" class="cloud-text-btn" data-cloud-action="resend-confirmation">Bestätigungsmail erneut anfordern</button><p class="cloud-hint">Bestätigungslinks sollen zu ${CLOUD_SITE_URL} führen. Falls sie auf localhost:3000 landen, unter Supabase → Authentication → URL Configuration die Site URL und erlaubten Redirect-URLs korrigieren. Nach bereits erfolgter Bestätigung kannst du dich direkt anmelden.</p></div>`:''}
 ${configured?`<details class="cloud-more"><summary>Supabase-Projekt wechseln</summary><div class="cloud-stage"><label>Projekt-URL<input id="cloudUrl" value="${esc(cloud.config.url)}"></label><label>Publishable Key<input id="cloudKey" value="${esc(cloud.config.key)}"></label><button class="cloud-secondary" data-cloud-action="save-config">Neue Verbindung speichern</button></div></details>`:''}
 <div class="cloud-instructions"><b>Öffentliches Wiki:</b><ol><li>Jeder Besucher sieht dieselben Artikel auch ohne Anmeldung.</li><li>Artikel ändern können nur per SQL freigeschaltete Redakteure.</li><li>Wenn noch kein öffentlicher Artikel existiert, kann ein Redakteur seine JSON-Sicherung importieren und veröffentlichen.</li></ol><small>Die öffentliche Sammlung ist für alle Internetnutzer sichtbar. Private lokale Altbestände werden nicht automatisch veröffentlicht.</small></div></div></div></div>`;
 host.innerHTML=content;
 for(const [id,value] of Object.entries(oldFields)){
  if(value===null)continue;
  const field=host.querySelector('#'+id);if(field)field.value=value;
 }
 const nextWindow=host.querySelector('.cloud-window');if(nextWindow)nextWindow.scrollTop=oldScroll;
 const nextFocus=activeId?host.querySelector('#'+activeId):null;
 if(nextFocus){nextFocus.focus({preventScroll:true});if(selection)try{nextFocus.setSelectionRange(selection[0],selection[1])}catch(e){}}
}
function cloudOpen(){document.getElementById('cloudHost').innerHTML='<div class="cloud-overlay" id="cloudModal"></div>';cloudRenderModal()}
function cloudClose(){document.getElementById('cloudHost').innerHTML=''}
async function cloudInitialize(){
 const preset=window.RECSERVERWIKI_CONFIG||{},stored=cloudGet(CLOUD_CFG_KEY);
 try{cloud.config=preset.url&&preset.key&&!String(preset.key).includes('HIER_EINFUEGEN')?cloudValidateConfig(preset.url,preset.key):(stored?cloudValidateConfig(stored.url,stored.key):null)}catch(e){console.warn('Ungültige Konfiguration',e);cloud.config=null}
 cloud.session=cloudGet(CLOUD_AUTH_KEY);cloud.role='reader';
 cloudReadConfirmation();
 if(!cloud.config){cloudStatus('Projekt ist noch nicht mit dem öffentlichen Supabase-Key verbunden.','local');return}
 if(cloud.session){try{await cloudToken();await cloudCheckRole();await cloudRestoreEditorDraft()}catch(e){cloud.session=null;cloud.role='reader';cloudPut(CLOUD_AUTH_KEY,null)}}
 await cloudReconcile();
}
const saveStateWithoutCloud=saveState;
saveState=async function(){const result=await saveStateWithoutCloud();cloudAfterLocalSave();return result};
const renderWithoutCloud=render;
render=function(){renderWithoutCloud();cloudStatus(cloud.lastMessage,cloud.status)};
// Read-only is enforced by Supabase RLS; interface also blocks editing controls.
document.addEventListener('click',e=>{
 if(cloudCanEdit())return;
 const target=e.target.closest('[data-new-type],[data-edit],[data-fav],[data-add-block],[data-link-trigger],[data-link-target], [data-act], [data-entry-type]');
 if(!target)return;
 const cmd=target.dataset.act;
 const protectedActions=['new','import-trigger','reset','save-exhibit','delete-exhibit','save-category','remove-category','add-category-editor','add-fact','delete-fact','add-item','delete-item','delete-image','delete-block','duplicate-block','move-up','move-down','remove-cover'];
 if(target.hasAttribute('data-new-type')||target.hasAttribute('data-edit')||target.hasAttribute('data-fav')||target.hasAttribute('data-add-block')||target.hasAttribute('data-link-trigger')||target.hasAttribute('data-link-target')||target.hasAttribute('data-entry-type')||protectedActions.includes(cmd)){
  e.preventDefault();e.stopImmediatePropagation();toast('Nur freigeschaltete Redakteure können das gemeinsame Wiki bearbeiten.');
 }
},true);
document.addEventListener('submit',e=>{if(!cloudCanEdit()&&e.target.id==='categoryForm'){e.preventDefault();e.stopImmediatePropagation();toast('Nur Redakteure können Kategorien bearbeiten.')}},true);
document.addEventListener('change',e=>{if(!cloudCanEdit()&&e.target.id==='importFile'){e.preventDefault();e.stopImmediatePropagation();e.target.value='';toast('Import nur für Redakteure möglich.')}},true);
document.addEventListener('click',async e=>{
 const act=e.target.closest('[data-cloud-action]');if(!act)return;
 e.preventDefault();e.stopImmediatePropagation();const a=act.dataset.cloudAction;
 try{
  if(a==='open')return cloudOpen();if(a==='close')return cloudClose();if(a==='save-config')return await cloudSaveConfig();if(a==='test-connection')return await cloudTestConnection();if(a==='resend-confirmation')return await cloudResendConfirmation();if(a==='login')return await cloudSignIn(false);if(a==='signup')return await cloudSignIn(true);if(a==='logout')return await cloudSignOut();if(a==='export')return downloadArchive();
  if(cloudSetBusyGuard())return;
  if(a==='check-role'){await cloudCheckRole();return cloudRenderModal()}if(a==='import-legacy')return await cloudImportLegacy()
  if(a==='choose-local')return await cloudChooseLocal();if(a==='choose-remote')return await cloudChooseRemote();
  if(a==='sync-now'&&cloudCanEdit()){cloud.dirty=true;return await cloudUpload('manual')}
  if(a==='check-now'){if(cloud.revision===null)return await cloudReconcile();await cloudCheck();cloudRenderModal()}
 }catch(e){cloudOnError(e)}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('cloudModal')){e.stopImmediatePropagation();cloudClose()}},true);
window.addEventListener('online',()=>{if(cloud.config&&!cloud.blocked){cloudCheck();if(cloud.dirty)cloudSchedule()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.config)cloudCheck()});
cloud.pollTimer=setInterval(()=>{if(cloud.config&&!document.hidden)cloudCheck()},20000);
// Never show old local drafts to guests before the public archive is loaded.
(async()=>{state={exhibits:[],categories:[],biographyPresets:emptyBiographyPresets()};render();await cloudInitialize()})();
</script></body></html>
